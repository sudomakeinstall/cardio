current_frame = 0
serialization_directory = "./data"
timestamp_format = "%Y-%m-%d-%H-%M-%S"

[background]
light = [1.0, 1.0, 1.0]
dark = [0.0, 0.0, 0.0]

[[meshes]]
label = "BL_Dense"
directory = "./data/obj-bl-dense"
visible = true
loop_subdivision_iterations = 1

[meshes.properties]
representation = 2
color = [1.0, 0.0, 0.0]
edge_visibility = false
vertex_visibility = false
shading = true
interpolation = 1

[[meshes]]
label = "BL_Simplified"
directory = "./data/obj-bl"
visible = true

[meshes.properties]
representation = 2
color = [1.0, 0.5, 0.5]
edge_visibility = true
vertex_visibility = false
shading = false
interpolation = 0

[[volumes]]
label="BL"
directory="./data/img-bl"
visible=true
transfer_function_preset="vascular_closed"
clipping_enabled=true

[[segmentations]]
label = "BL_Labels"
directory = "./data/seg-bl"
visible = true

# What the app opens on.  `layout` is the quad MPR view unless a viewport is
# named: volume, axial, coronal, sagittal, tile, or volumetry.  `theme` selects between the
# two backgrounds above.
[view]
layout = "tile"
theme = "dark"
camera_lock = "free"                     # free, UL, LL, or LR
drawer_sections = ["playback", "tiles"]  # playback, appearance, orientation, zoom, tiles, volumetry, export
help_visible = false
metadata_visible = false

# Where the playback controls start.  BPM and beats per rotation describe the
# acquisition rather than a preference, so they belong with the dataset.
[playback]
bpm = 60
bpr = 3
incrementing = true
rotating = false

# Where the MPR views start, and what they follow.  Traverse mode walks the
# line from the BL_Labels 1|2 interface to its 2|3 interface; `traverse` is how
# far along that line to begin, and the locks hold the views there as the frame
# changes.  Reset returns to whatever is written here.
[snap]
segmentation_label = "BL_Labels"
mode = "traverse"
labels_a = [1]
labels_b = [2]
labels_c = [3]
traverse = 50
locked = true
orientation_locked = true


# What the volumetry charts measure.  A structure is a group of labels rather
# than a single one, because a chamber segmented as a bloodpool, an outflow
# tract and a trabecular mesh is one chamber; `density` reports a structure as
# a mass instead of a volume, and `cycle = false` says the difference between
# its extremes is shape rather than flow, so no stroke volume or ejection
# fraction is quoted for it.
#
# Volumes are also indexed by body surface area when one can be had.  The
# height and weight come from the images' PatientSize and PatientWeight tags
# unless given here, in metres and kilograms.
[volumetry]
segmentation_label = "BL_Labels"
indexed = true
bsa_formula = "mosteller"    # none, mosteller, dubois, or haycock
# patient_height_m = 1.78
# patient_weight_kg = 74

[[volumetry.groups]]
name = "LV"
labels = [6, 3, 8]           # bloodpool + outflow tract + trabeculations

[[volumetry.groups]]
name = "RV"
labels = [5]

[[volumetry.groups]]
name = "LA"
labels = [2]

[[volumetry.groups]]
name = "RA"
labels = [4]

[[volumetry.groups]]
name = "Myo"
labels = [1]
density = 1.05               # g/mL, so the myocardium is reported in grams
cycle = false
